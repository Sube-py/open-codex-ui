name: Python Package

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish the current npm package version
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Test frontend
        run: pnpm --dir web test:unit

      - name: Test npm launcher
        run: npm --prefix packages/npm-launcher test

      - name: Build frontend
        run: pnpm --dir web build

      - name: Test backend
        run: uv run --all-packages pytest

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir web build

      - name: Build package
        run: uv build

      - name: Verify packaged frontend
        run: unzip -l dist/*.whl | grep -q 'yier_web/static/index.html'

      - name: Check distributions
        run: uvx twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  build-npm:
    name: Build npm launcher
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Pack npm launcher
        run: npm pack
        working-directory: packages/npm-launcher

      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-distribution
          path: packages/npm-launcher/open-codex-ui-*.tgz

  publish-to-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/open-codex-ui/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build-npm
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_npm)
    environment:
      name: npm
      url: https://www.npmjs.com/package/open-codex-ui
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Download npm package
        uses: actions/download-artifact@v4
        with:
          name: npm-package-distribution
          path: npm-dist/

      - name: Publish npm package
        run: npm publish ./npm-dist/*.tgz --access public --provenance

  publish-to-github:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build
      - build-npm
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: release-dist/

      - name: Download npm package
        uses: actions/download-artifact@v4
        with:
          name: npm-package-distribution
          path: release-dist/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-dist/*
