[project]
name = "open-codex-ui"
version = "0.1.12"
description = "Remote-friendly web workspace for Codex sessions"
readme = "README.md"
authors = [{ name = "Sube" }]
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "open-codex-bridge>=0.1.12",
    "granian[reload]>=2.7.2",
    "httpx>=0.28.1",
    "litestar>=2.21.1",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "yier-agents>=0.1.3",
]

[project.scripts]
open-codex-ui = "yier_web.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["yier_web*"]

[tool.setuptools.package-data]
yier_web = ["static/*", "static/**/*"]

[tool.uv.workspace]
members = ["packages/yier-channel"]

[tool.uv.sources]
yier-channel = { workspace = true }

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.15.10"]
